<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Elitlig Araçlar — Bağlantı yok</title>
<style>
  :root { --bg: #f4f5fa; --card: #fff; --text: #1d1530; --muted: #6b6480; --brand: #5b1767; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14101c; --card: #1f1a2b; --text: #f1edf7; --muted: #a49cb5; --brand: #c58bd3; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select: none; }
  .card { background: var(--card); padding: 36px 40px; border-radius: 18px; max-width: 420px; text-align: center;
    box-shadow: 0 10px 40px rgba(20, 10, 40, .12); }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  .icon { font-size: 40px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 10px 22px;
    font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #14101c; } }
  small { display: block; margin-top: 16px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Elitlig'e ulaşılamıyor</h1>
    <p>İnternet bağlantınızı kontrol edin. Bağlantı geldiğinde Araçlar kendiliğinden yeniden açılır.</p>
    <button id="retry" type="button">Yeniden dene</button>
    <small>Oturumunuz açık kalır; yeniden giriş yapmanız gerekmez.</small>
  </div>
<script>
  const retry = () => window.elitligDesktop && window.elitligDesktop.retry();
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
  setInterval(() => { if (navigator.onLine) retry(); }, 15000);
</script>
</body>
</html>
