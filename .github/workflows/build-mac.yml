# Mac kurulum dosyasını (.dmg) üretir ve GitHub Releases'e yükler.
#
# Her push'ta macOS üzerinde Apple Silicon + Intel'de çalışan evrensel
# (universal) uygulama derlenir. Çıktılar iş sonunda "Artifacts" altında,
# ayrıca package.json sürümüyle adlanan sürüm sayfasında (Releases) durur.
name: Mac uygulaması

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund

      - name: Testler
        run: npm test

      - name: Derle (.dmg + .zip, universal)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Açılış testi (uygulama 25 sn çökmeden çalışmalı)
        run: |
          APP=$(ls -d dist/mac-universal/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          BIN=$(ls "$APP"/Contents/MacOS/* | head -1)
          echo "Çalıştırılan: $BIN"
          "$BIN" --enable-logging=stderr > launch.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then echo "Uygulama çalışıyor"; kill $PID; else echo "UYGULAMA ÇÖKTÜ"; cat launch.log; exit 1; fi
          grep -iE "error|fatal|crash" launch.log | head -40 || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | head || true

      - name: Sürüm bilgisi
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Elitlig-Araclar-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: GitHub Releases'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Elitlig Araçlar ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            **Elitlig Araçlar — Mac masaüstü uygulaması**

            1. `Elitlig-Araclar-${{ steps.version.outputs.version }}.dmg` dosyasını indirin ve çift tıklayın.
            2. Açılan pencerede **Elitlig Araçlar** simgesini **Applications (Uygulamalar)** klasörüne sürükleyin.
            3. İlk açılışta: Uygulamalar klasöründe simgeye **sağ tıklayıp → Aç** deyin
               (macOS 15'te: Sistem Ayarları → Gizlilik ve Güvenlik → **Yine de Aç**).
            4. Yönetim hesabınızla bir kez giriş yapın; oturum 3 ay boyunca açık kalır.

            Apple Silicon (M1/M2/M3/M4) ve Intel Mac'lerde çalışır. macOS 11 ve üzeri.
